name: Release extension

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and manifest version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$MANIFEST_VERSION"
          test "$MANIFEST_VERSION" = "$PACKAGE_VERSION"
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Run quality gates
        run: npm run check

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Build production package
        run: NODE_ENV=production npm run build

      - name: Package deterministic file set
        shell: bash
        run: |
          ZIP_NAME="hyper-cookies-${RELEASE_VERSION}.zip"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          find dist -type f -exec touch -d "@${SOURCE_DATE_EPOCH}" {} +
          cd dist
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X "../${ZIP_NAME}"
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Attest release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP_NAME" \
            "$ZIP_NAME.sha256" \
            --verify-tag \
            --title "Hyper Cookies ${RELEASE_VERSION}" \
            --generate-notes
